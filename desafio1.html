<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boletin Escolar</title>
  </head>

  <style>
    .tabela {
      overflow-x: auto;
    }

    table {
      border-collapse: collapse;
      min-width: 500px;
      background-color: #f0f0f0;
    }

    th,
    td {
      border: 1px solid #999;
      padding: 8px;
    }
  </style>

  <body>
    <div class="tabela">
      <table>
        <caption>
          Notas Front-End 2026
        </caption>
        
        <thead>
          <tr>
            <th scope="col">Aluno</th>
            <th scope="col">HTML</th>
            <th scope="col">CSS</th>
            <th scope="col">JavaScript</th>
          </tr>
        </thead>

        <tbody>
          <thead>
            <tr>
              <th scope="row">Ana</th>
              <td>9,0</td>
              <td>8,5</td>
              <td>8,0</td>
            </tr>
          </thead>

          <thead>
            <tr>
              <th scope="row">João</th>
              <td>7,5</td>
              <td>9,0</td>
              <td>8,5</td>
            </tr>
          </thead>

          <thead>
            <tr>
              <th scope="row">Marina</th>
              <td>8,5</td>
              <td>9,5</td>
              <td>9,0</td>
            </tr>
          </thead>

          <thead>
            <tr>
              <th scope="row">Pedro</th>
              <td>6,5</td>
              <td>7,0</td>
              <td>8,0</td>
            </tr>
          </thead>

          <thead>
            <tr>
              <th scope="row">Larissa</th>
              <td>9,5</td>
              <td>9,0</td>
              <td>9,5</td>
            </tr>
          </thead>
        </tbody>
      </table>
    </div>
  </body>
</html>
