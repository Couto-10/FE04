<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horario das Aulas</title>
  </head>

  <style>
    .tabela {
      overflow-x: auto;
    }

    table {
      border-collapse: collapse;
      min-width: 500px;
      background-color: #f0f0f0;
    }

    th,
    td {
      border: 1px solid #999;
      padding: 8px;
    }
  </style>

  <body>
    <div class="tabela">
      <table>
        <caption>
          Horário das Aulas — Turma Front-End 2026
        </caption>
        
        <thead>
          <tr>
            <th scope="row">Horario</th>
            <th scope="row">Segunda</th>
            <th scope="row">Terça</th>
            <th scope="row">Quarta</th>
            <th scope="row">Quinta</th>
            <th scope="row">Sexta</th>
          </tr>
        </thead>
        
        <tbody>
          <thead>
            <tr>
              <th scope="col">08h&nbsp;&ndash;&nbsp;10h</th>
              <td>HTML</td>
              <td>CSS</td>
              <td>JavaScript</td>
              <td>HTML</td>
              <td>Projeto</td>
            </tr>
          </thead>

          <thead>
            <tr>
              <th scope="col">10h&nbsp;&ndash;&nbsp;12h</th>
              <td>CSS</td>
              <td>JavaScript</td>
              <td>HTML</td>
              <td>Projeto</td>
              <td>Projeto</td>
            </tr>
          </thead>

          <thead>
            <tr>
              <th scope="col">12h&nbsp;&ndash;&nbsp;14h</th>
              <td>Projeto</td>
              <td>Projeto</td>
              <td>Projeto</td>
              <td>CSS</td>
              <td>JavaScript</td>
            </tr>
          </thead>
        </tbody>
      </table>
    </div>
  </body>
</html>
